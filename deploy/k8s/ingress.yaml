# Requires: an ingress controller (ingress-nginx) + cert-manager with a
# ClusterIssuer named `letsencrypt-prod`. On bare metal you also need something
# to expose the controller (MetalLB, or the controller on hostNetwork/NodePort
# behind an external LB/HAProxy).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobhunt-app
  namespace: jobhunt
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m" # CV uploads (MAX_UPLOAD_MB=8)
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [jobhunt.plutusai.info]
      secretName: jobhunt-tls
  rules:
    - host: jobhunt.plutusai.info
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jobhunt-app
                port: { number: 80 }
---
# Public endpoint for MinIO so browser-facing presigned CV URLs resolve.
# Delete this if you use an external object store instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio
  namespace: jobhunt
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [minio.plutusai.info]
      secretName: minio-tls
  rules:
    - host: minio.plutusai.info
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port: { number: 9000 }
