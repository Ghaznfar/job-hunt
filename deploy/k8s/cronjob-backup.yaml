# Nightly pg_dump into the MinIO bucket. Minimal safety net for the
# single-instance Postgres — restore with `pg_restore` / `psql`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jobhunt-pg-backup
  namespace: jobhunt
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: postgres:17-alpine
              command:
                - sh
                - -c
                - |
                  set -e
                  apk add --no-cache aws-cli >/dev/null
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  FILE=/tmp/jobhunt-$TS.dump
                  PGPASSWORD="$PGPW" pg_dump -h postgres -U jobhunt -d jobhunt -Fc -f "$FILE"
                  AWS_ACCESS_KEY_ID="$AK" AWS_SECRET_ACCESS_KEY="$SK" \
                    aws --endpoint-url http://minio:9000 s3 cp "$FILE" "s3://jobhunt-cv/backups/jobhunt-$TS.dump"
                  echo "uploaded jobhunt-$TS.dump"
              env:
                - name: PGPW
                  valueFrom: { secretKeyRef: { name: jobhunt-secret, key: POSTGRES_PASSWORD } }
                - name: AK
                  valueFrom: { secretKeyRef: { name: jobhunt-secret, key: S3_ACCESS_KEY_ID } }
                - name: SK
                  valueFrom: { secretKeyRef: { name: jobhunt-secret, key: S3_SECRET_ACCESS_KEY } }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
