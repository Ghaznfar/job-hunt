apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jobhunt

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml # copy from secret.example.yaml first (gitignored)
  - postgres.yaml
  - minio.yaml
  - app.yaml
  - ingress.yaml
  - cronjob-ingest.yaml
  - cronjob-backup.yaml
  # seed-job.yaml is applied manually once — not part of the base

# Set your image + tag here (or `kustomize edit set image ...` in CI).
images:
  - name: ghcr.io/OWNER/ai-hunting-job-saas-mvp
    newName: ghcr.io/plutus/ai-hunting-job-saas-mvp
    newTag: latest
