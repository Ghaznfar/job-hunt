# In-cluster S3-compatible object storage for private CV uploads.
# The app's storage abstraction already speaks S3 — it just needs an endpoint.
#
# IMPORTANT: presigned download URLs the app generates point at S3_ENDPOINT, so
# that endpoint must be reachable from the user's browser. That's why MinIO is
# exposed on its own Ingress host (minio.plutusai.info) in ingress.yaml.
# If you'd rather not self-host object storage, point S3_ENDPOINT/keys at
# Cloudflare R2, AWS S3, or Backblaze B2 and delete this file from kustomization.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: jobhunt
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: jobhunt
  labels: { app: minio }
spec:
  selector: { app: minio }
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: jobhunt
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-08T15-41-24Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: jobhunt-secret, key: S3_ACCESS_KEY_ID }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: jobhunt-secret, key: S3_SECRET_ACCESS_KEY }
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 8
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
# One-shot: create the bucket after MinIO is up.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: jobhunt
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-08T15-39-49Z
          command:
            - sh
            - -c
            - |
              set -e
              until mc alias set local http://minio:9000 "$AK" "$SK"; do sleep 3; done
              mc mb --ignore-existing local/jobhunt-cv
              mc anonymous set none local/jobhunt-cv
              echo "bucket ready"
          env:
            - name: AK
              valueFrom: { secretKeyRef: { name: jobhunt-secret, key: S3_ACCESS_KEY_ID } }
            - name: SK
              valueFrom: { secretKeyRef: { name: jobhunt-secret, key: S3_SECRET_ACCESS_KEY } }
