apiVersion: v1
kind: Service
metadata:
  name: jobhunt-app
  namespace: jobhunt
  labels: { app: jobhunt-app }
spec:
  selector: { app: jobhunt-app }
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
# Local CV storage. RWO PVC → survives pod restarts but binds to one node, so the
# Deployment runs a single replica. Scaling past 1 requires shared object storage
# (apply the minio component, or point STORAGE_DRIVER=s3 at an external bucket).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jobhunt-uploads
  namespace: jobhunt
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobhunt-app
  namespace: jobhunt
  labels: { app: jobhunt-app }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate # RWO volume can't be attached to old+new pods simultaneously
  selector:
    matchLabels: { app: jobhunt-app }
  template:
    metadata:
      labels: { app: jobhunt-app }
    spec:
      # Let the non-root app user own the mounted uploads volume.
      securityContext:
        fsGroup: 1001
      # Run DB migrations once per rollout, before the app container starts.
      initContainers:
        - name: migrate
          image: ghcr.io/OWNER/ai-hunting-job-saas-mvp:latest
          command: ["node_modules/.bin/prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef: { name: jobhunt-config }
            - secretRef: { name: jobhunt-secret }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      containers:
        - name: app
          image: ghcr.io/OWNER/ai-hunting-job-saas-mvp:latest
          command: ["node", "server.js"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: jobhunt-config }
            - secretRef: { name: jobhunt-secret }
          volumeMounts:
            - name: uploads
              mountPath: /data
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 8
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 300Mi }
            limits: { cpu: "1", memory: 600Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001 # matches the `nextjs` user baked into the image
            runAsGroup: 1001
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: jobhunt-uploads
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jobhunt-app
  namespace: jobhunt
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: jobhunt-app }
