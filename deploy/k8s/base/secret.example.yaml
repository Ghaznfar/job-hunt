# Copy to secret.yaml, fill in, and `kubectl apply -f secret.yaml`.
# secret.yaml is gitignored. For real ops use sealed-secrets, SOPS, or
# external-secrets instead of a plain manifest.
#
# Generate values:
#   AUTH_SECRET      : openssl rand -base64 32
#   CRON_SECRET      : openssl rand -hex 24
#   POSTGRES_PASSWORD: openssl rand -hex 24
#   MINIO creds      : openssl rand -hex 20  (x2)
apiVersion: v1
kind: Secret
metadata:
  name: jobhunt-secret
  namespace: jobhunt
type: Opaque
stringData:
  # --- Postgres (in-cluster StatefulSet) ---
  POSTGRES_PASSWORD: "CHANGE_ME_pg"
  # Full URLs the app uses. Host `postgres` is the in-cluster Service.
  DATABASE_URL: "postgresql://jobhunt:CHANGE_ME_pg@postgres:5432/jobhunt?schema=public"
  DIRECT_URL: "postgresql://jobhunt:CHANGE_ME_pg@postgres:5432/jobhunt?schema=public"

  # --- Auth ---
  AUTH_SECRET: "CHANGE_ME_base64_32"
  ADMIN_EMAILS: "you@plutusai.info"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

  # --- Cron trigger shared secret ---
  CRON_SECRET: "CHANGE_ME_cron"

  # --- AI (optional; leave blank to stay on the mock) ---
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""

  # --- Jobs (optional) ---
  ADZUNA_APP_ID: ""
  ADZUNA_APP_KEY: ""

  # --- CV storage: in-cluster MinIO root credentials ---
  S3_ACCESS_KEY_ID: "CHANGE_ME_minio_key"
  S3_SECRET_ACCESS_KEY: "CHANGE_ME_minio_secret"

  # --- Stripe (optional until you enable paid plans) ---
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
  STRIPE_PRO_PRICE_ID: ""

  # --- Email (optional) ---
  RESEND_API_KEY: ""
